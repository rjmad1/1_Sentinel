name: Sentinel EIIP Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-frontend:
    name: Frontend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test:frontend

  build-frontend:
    name: Production SPA Build & Artifact Packaging
    runs-on: ubuntu-latest
    needs: [validate-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Production Web Application
        run: npm run build

      - name: Upload Production SPA Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-frontend-dist
          path: dist/
          retention-days: 14

  validate-backend:
    name: Backend Pytest & Integration Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: insforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/insforge"
          DEVELOPMENT_MODE: "true"
          PYTHONPATH: "."
        run: |
          pytest tests/backend tests/integration

  validate-contracts:
    name: Schema & Contract Compatibility Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Telemetry JSON Schema Contracts
        run: npx playwright test tests/contract/jsonSchema.spec.ts

  validate-intelligence:
    name: Intelligence Quality Release Evaluator
    runs-on: ubuntu-latest
    needs: [validate-frontend, validate-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Release Quality Evaluator
        run: npm run test:evaluate

      - name: Upload Release Quality Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-release-quality-report
          path: walkthrough.md
          retention-days: 14

  validate-docker:
    name: Docker Multi-Stage Container Build Verification
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sentinel Multi-Stage Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sentinel-eiip:ci-test

  security-scan:
    name: Dependency Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: NPM Package Security Audit
        run: npm audit --audit-level=high || echo "NPM Audit completed with non-blocking warnings."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Safety & Pip Audit Check
        run: |
          python -m pip install --upgrade pip
          pip install safety || true
          safety check -r requirements.txt || echo "Python safety audit completed with non-blocking warnings."

  package-release:
    name: Automated Release Package Bundler
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-frontend, validate-backend, validate-intelligence, validate-contracts, validate-docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: sentinel-frontend-dist
          path: dist/

      - name: Create Release Archive
        run: |
          zip -r sentinel-eiip-release-${{ github.sha }}.zip dist/ Phase2_Integration/ requirements.txt Dockerfile docker-compose.yml ARCHITECTURE.md README.md

      - name: Upload Sentinel Production Release Package
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-eiip-production-release-${{ github.sha }}
          path: sentinel-eiip-release-${{ github.sha }}.zip
          retention-days: 30

  pipeline-summary:
    name: Pipeline Execution Summary Dashboard
    runs-on: ubuntu-latest
    if: always()
    needs: [validate-frontend, build-frontend, validate-backend, validate-contracts, validate-intelligence, validate-docker, security-scan]
    steps:
      - name: Generate Pipeline Summary Report
        run: |
          echo "# 🚀 Sentinel EIIP Automated CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Job | Status | Target Scope |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Code Quality & Unit Tests** | ${{ needs.validate-frontend.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | ESLint, TypeScript Compiler, Vitest |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production SPA Build Verification** | ${{ needs.build-frontend.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | Vite Bundler, Asset Packaging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Pytest & Database Integration** | ${{ needs.validate-backend.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | Python 3.11, PostgreSQL 16 Service |" >> $GITHUB_STEP_SUMMARY
          echo "| **Telemetry Schema Contract Testing** | ${{ needs.validate-contracts.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | Playwright Schema Assertions |" >> $GITHUB_STEP_SUMMARY
          echo "| **Intelligence Release Quality Evaluator** | ${{ needs.validate-intelligence.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | Golden Dataset Quality Evaluator |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Container Build Verification** | ${{ needs.validate-docker.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | Multi-stage Dockerfile |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Vulnerability Audit** | ${{ needs.security-scan.result == 'success' && '🟢 Passed' || '🔴 Failed' }} | NPM Audit & Python Safety |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Report automatically generated by Sentinel EIIP Workflow Engine at commit SHA: \`${{ github.sha }}\`*" >> $GITHUB_STEP_SUMMARY
