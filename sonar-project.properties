# SonarQube static analysis configuration
sonar.projectKey=sentinel-eiip
sonar.projectName=Enterprise Infrastructure Intelligence Platform
sonar.projectVersion=1.0.0

# Paths to source and test directories
sonar.sources=src,scripts
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.nupkg,**/lib/**/*.dll

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report paths (if generated in pipelines)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
